<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaPorto | Consulta de Frete</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS (Para ler sua planilha criptografada em tempo real) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#070A12', 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
                        brand: { blue: '#2563EB', cyan: '#38BDF8', emerald: '#10B981' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar (Apenas a Consulta) -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700/80 flex flex-col shadow-2xl z-20">
        <div class="h-20 flex flex-col justify-center px-6 border-b border-slate-700/80">
            <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center">
                <i class="fa-solid fa-ship text-brand-cyan mr-2.5 text-xl"></i>Rota<span class="text-brand-cyan">Porto</span>
            </h1>
        </div>
        <nav class="flex-1 px-3 py-6 space-y-2">
            <a href="#" class="nav-item flex items-center px-4 py-3.5 text-white rounded-xl bg-blue-600 shadow-lg shadow-blue-600/30 border-l-4 border-brand-cyan">
                <i class="fa-solid fa-magnifying-glass-location w-6 text-white"></i>
                <span class="font-semibold text-sm">Consulta de Frete</span>
            </a>
        </nav>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col h-screen relative overflow-y-auto bg-slate-900">
        <header class="h-20 bg-slate-900/90 backdrop-blur-md sticky top-0 z-10 px-8 flex items-center justify-between border-b border-slate-800">
            <h2 class="text-xl font-bold text-white tracking-tight">Consulta de Frete</h2>
            <div class="flex items-center space-x-3 bg-slate-800 border border-slate-700 p-1.5 rounded-lg">
                <input type="password" id="input-senha-excel" placeholder="Senha da Planilha" value="ADM2026" class="bg-slate-900 text-white text-xs px-3 py-2 rounded-md border border-slate-700 outline-none w-32 focus:border-blue-500">
                <label for="excel-file" class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-md text-xs transition flex items-center">
                    <i class="fa-solid fa-file-excel mr-1.5"></i> Sincronizar Base Oficial
                </label>
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="hidden" onchange="importarBaseCompleta(event)">
            </div>
        </header>

        <div class="p-8 max-w-7xl mx-auto w-full">
            <!-- Painel de Filtros e Cálculos -->
            <div class="bg-slate-800 border border-blue-500/30 rounded-2xl p-6 mb-8 shadow-2xl">
                <form class="grid grid-cols-1 md:grid-cols-5 gap-5" onchange="filtrarEcalcular()" onkeyup="filtrarEcalcular()">
                    
                    <!-- Busca Básica -->
                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5">Terminal / Porto</label>
                        <select id="select-porto" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 transition">
                            <option value="">TODOS</option>
                        </select>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5">Cliente (Opcional)</label>
                        <select id="select-cliente" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 transition">
                            <option value="">TODOS</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5">Destino</label>
                        <div class="relative">
                            <i class="fa-solid fa-location-dot absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                            <input type="text" id="input-destino" placeholder="Ex: Recife, Jundiaí, Guarulhos..." class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-blue-500 transition">
                        </div>
                    </div>

                    <!-- Calculadora Integrada -->
                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5">Tipo Carga</label>
                        <select id="select-carga" class="w-full bg-blue-900/40 border border-blue-500/50 text-brand-cyan font-bold text-sm rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 transition">
                            <option value="L">L</option>
                            <option value="LS">LS</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold uppercase text-amber-400 mb-1.5">Valor da NF (R$) p/ Cálculo GRIS/ADV</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3 text-slate-500 text-sm font-bold">R$</span>
                            <input type="number" id="input-nf" value="100000" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-amber-500 transition">
                        </div>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase text-emerald-400 mb-1.5">% ICMS</label>
                        <div class="relative">
                            <input type="number" id="input-icms" value="12" step="0.1" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 outline-none focus:border-emerald-500 transition">
                            <span class="absolute right-4 top-3 text-slate-500 text-sm font-bold">%</span>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabela de Resultados (Base de Dados) -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl relative z-10">
                <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                    <h4 class="font-bold text-white text-sm flex items-center">
                        <i class="fa-solid fa-database text-brand-cyan mr-2"></i> Base de Dados Oficial
                    </h4>
                    <span id="total-registros" class="text-xs text-slate-400 font-semibold bg-slate-900 px-3 py-1 rounded-md border border-slate-700">0 rotas</span>
                </div>
                
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead class="sticky top-0 bg-slate-900 shadow-md z-10">
                            <tr class="text-slate-300 border-b border-slate-700">
                                <th class="py-3 px-4 font-bold border-r border-slate-700">CLIENTE</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700">TERMINAL</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700">DESTINO</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-brand-cyan bg-blue-900/10" id="th-frete">FRETE</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-brand-cyan bg-blue-900/10" id="th-pedagio">PEDÁGIO</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-amber-400">GRIS (0.3%)</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-amber-400">ADV (0.2%)</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-white">TOTAL S/ ICMS</th>
                                <th class="py-3 px-4 font-bold text-right text-brand-emerald bg-emerald-900/20">TOTAL C/ ICMS</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="text-slate-300 divide-y divide-slate-700/50">
                            <!-- JS Injeta Aqui -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Uma pequena base demonstrativa para a tela não iniciar vazia,
        // enquanto o usuário não importa a planilha completa no topo.
        let baseFretes = [
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'RECIFE', freteL: 1475.23, freteLS: 1575.29, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CARUARU', freteL: 2795.34, freteLS: 3034.39, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'PETROLINA', freteL: 10471.18, freteLS: 11495.80, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'MERCOSUL FROTA', porto: 'GUARUJA/SANTOS', destino: 'CAMPINAS', freteL: 2868, freteLS: 2868, pedagioL: 0, pedagioLS: 0 }
        ];

        const formatMoeda = (v) => v ? v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : "R$ 0,00";

        // Filtra e calcula conforme a planilha
        function filtrarEcalcular() {
            const portoSel = document.getElementById('select-porto').value.toUpperCase();
            const clienteSel = document.getElementById('select-cliente').value.toUpperCase();
            const destinoInput = document.getElementById('input-destino').value.toUpperCase().trim();
            const cargaSel = document.getElementById('select-carga').value; // 'L' ou 'LS'
            
            const valorNF = parseFloat(document.getElementById('input-nf').value) || 0;
            const taxaICMS = parseFloat(document.getElementById('input-icms').value) || 0;

            document.getElementById('th-frete').innerText = `FRETE ${cargaSel}`;
            document.getElementById('th-pedagio').innerText = `PEDÁGIO ${cargaSel}`;

            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';
            let contador = 0;

            baseFretes.forEach(f => {
                const porto = (f.porto || '').toUpperCase();
                const cliente = (f.cliente || '').toUpperCase();
                const destino = (f.destino || '').toUpperCase();

                if ((portoSel === '' || porto === portoSel) && 
                    (clienteSel === '' || cliente === clienteSel) &&
                    (destinoInput === '' || destino.includes(destinoInput))) {
                    
                    contador++;
                    
                    let valorFrete = cargaSel === 'L' ? f.freteL : f.freteLS;
                    let valorPedagio = cargaSel === 'L' ? f.pedagioL : f.pedagioLS;
                    
                    // Tratamento "Vale Pedágio" embutido na planilha
                    if (isNaN(valorFrete)) valorFrete = 0;
                    if (isNaN(valorPedagio)) valorPedagio = 0;

                    // Regra: Na planilha, alguns clientes como ARLANXEO ou NORSAL "NÃO PREENCHER" o GRIS/ADV
                    let isGrisAdvIsento = ['ARLANXEO', 'NORSAL', 'DHL', 'GAC'].some(c => cliente.includes(c));

                    let gris = isGrisAdvIsento ? 0 : valorNF * 0.003; // 0.3%
                    let adv = isGrisAdvIsento ? 0 : valorNF * 0.002;  // 0.2%
                    
                    let totalSemIcms = valorFrete + valorPedagio + gris + adv;
                    // Cálculo de ICMS "por dentro"
                    let divisorIcms = 1 - (taxaICMS / 100);
                    let totalComIcms = divisorIcms > 0 ? (totalSemIcms / divisorIcms) : totalSemIcms;

                    const bgRow = contador % 2 === 0 ? 'bg-slate-900/30' : 'bg-slate-800/10';

                    tbody.innerHTML += `
                        <tr class="${bgRow} hover:bg-blue-900/20 transition-colors">
                            <td class="py-2.5 px-4 font-semibold text-slate-100 border-r border-slate-700/50">${f.cliente || '-'}</td>
                            <td class="py-2.5 px-4 text-slate-300 border-r border-slate-700/50">${f.porto || '-'}</td>
                            <td class="py-2.5 px-4 font-bold text-white border-r border-slate-700/50">${f.destino || '-'}</td>
                            <td class="py-2.5 px-4 text-right font-medium text-brand-cyan border-r border-slate-700/50 bg-blue-900/5">${formatMoeda(valorFrete)}</td>
                            <td class="py-2.5 px-4 text-right font-medium text-brand-cyan border-r border-slate-700/50 bg-blue-900/5">${formatMoeda(valorPedagio)}</td>
                            <td class="py-2.5 px-4 text-right font-medium text-amber-200/80 border-r border-slate-700/50">${formatMoeda(gris)}</td>
                            <td class="py-2.5 px-4 text-right font-medium text-amber-200/80 border-r border-slate-700/50">${formatMoeda(adv)}</td>
                            <td class="py-2.5 px-4 text-right font-bold text-white border-r border-slate-700/50">${formatMoeda(totalSemIcms)}</td>
                            <td class="py-2.5 px-4 text-right font-extrabold text-brand-emerald bg-emerald-900/10">${formatMoeda(totalComIcms)}</td>
                        </tr>
                    `;
                }
            });

            if (contador === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-slate-500 font-semibold">Nenhuma rota encontrada. Tente importar sua planilha oficial acima.</td></tr>`;
            }

            document.getElementById('total-registros').innerText = `${contador} rotas listadas`;
        }

        // MOTOR DE IMPORTAÇÃO DE TODAS AS ABAS (CC 73, CC 74, CC 757, CC 804, CC 789)
        function importarBaseCompleta(event) {
            const file = event.target.files[0];
            const senha = document.getElementById('input-senha-excel').value;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // Como a API local JS não quebra criptografia complexa no client-side nativo sem plugins pesados, 
                    // esta implementação lê a planilha normal. No uso real diário, você salva a planilha sem senha 
                    // no PC local antes de importar, ou usa o banco de dados via backend.
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const abasDesejadas = ['CC 73', 'CC 74', 'CC 757', 'CC 804', 'CC 789'];
                    let novaBase = [];
                    let portosUnicos = new Set();
                    let clientesUnicos = new Set();

                    abasDesejadas.forEach(sheetName => {
                        if (workbook.Sheets[sheetName]) {
                            // Localiza as colunas pelos cabeçalhos exatos da sua planilha
                            const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                            
                            // Acha a linha onde está o cabeçalho "DESTINO"
                            let cabecalhoIdx = -1;
                            for(let i=0; i<sheetData.length; i++) {
                                if (sheetData[i].some(v => String(v).toUpperCase().includes('DESTINO') && String(v).toUpperCase().includes('FRETE'))) {
                                    cabecalhoIdx = i; break;
                                }
                            }

                            if (cabecalhoIdx > -1) {
                                const headers = sheetData[cabecalhoIdx].map(h => String(h).toUpperCase().trim());
                                const iCliente = headers.findIndex(h => h.includes('CLIENTE'));
                                const iPorto = headers.findIndex(h => h.includes('ORIGEM') || h.includes('PORTO'));
                                const iDestino = headers.findIndex(h => h.includes('DESTINO'));
                                const iFreteL = headers.findIndex(h => h === 'FRETE L' || h === 'FRETE L ');
                                const iPedL = headers.findIndex(h => h.includes('PEDÁGIO L') && !h.includes('LS'));
                                const iFreteLS = headers.findIndex(h => h.includes('FRETE LS'));
                                const iPedLS = headers.findIndex(h => h.includes('PEDÁGIO LS'));

                                for (let i = cabecalhoIdx + 1; i < sheetData.length; i++) {
                                    const row = sheetData[i];
                                    if (row[iDestino]) {
                                        
                                        const extraiNum = (val) => {
                                            if (!val || String(val).toUpperCase().includes('VALE')) return 0;
                                            const v = parseFloat(String(val).replace(',', '.'));
                                            return isNaN(v) ? 0 : v;
                                        };

                                        novaBase.push({
                                            cliente: row[iCliente] || 'N/D',
                                            porto: row[iPorto] || 'N/D',
                                            destino: row[iDestino],
                                            freteL: extraiNum(row[iFreteL]),
                                            pedagioL: extraiNum(row[iPedL]),
                                            freteLS: extraiNum(row[iFreteLS]),
                                            pedagioLS: extraiNum(row[iPedLS])
                                        });

                                        if (row[iPorto]) portosUnicos.add(row[iPorto]);
                                        if (row[iCliente]) clientesUnicos.add(row[iCliente]);
                                    }
                                }
                            }
                        }
                    });

                    if (novaBase.length > 0) {
                        baseFretes = novaBase;
                        
                        // Atualiza Selects
                        const selPorto = document.getElementById('select-porto');
                        selPorto.innerHTML = '<option value="">TODOS</option>';
                        portosUnicos.forEach(p => selPorto.innerHTML += `<option value="${p}">${p}</option>`);

                        const selCliente = document.getElementById('select-cliente');
                        selCliente.innerHTML = '<option value="">TODOS</option>';
                        clientesUnicos.forEach(c => selCliente.innerHTML += `<option value="${c}">${c}</option>`);

                        filtrarEcalcular();
                        alert(`Sucesso! ${novaBase.length} rotas importadas das 5 abas.`);
                    } else {
                        alert("Não foi possível encontrar os cabeçalhos padrão nas abas indicadas.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Erro ao ler a planilha. Se estiver criptografada, o Javascript do navegador requer que você primeiro salve uma cópia sem senha.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        document.addEventListener('DOMContentLoaded', filtrarEcalcular);
    </script>
</body>
</html>
