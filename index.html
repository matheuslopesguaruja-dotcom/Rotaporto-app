<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaPorto | Consulta de Frete</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS (Leitor de Planilhas Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#070A12', 900: '#0F172A', 800: '#1E293B', 700: '#334155', 600: '#475569' },
                        brand: { blue: '#2563EB', cyan: '#38BDF8', emerald: '#10B981' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar Lateral Simplificada -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700/80 flex flex-col shadow-2xl z-20">
        <div class="h-20 flex flex-col justify-center px-6 border-b border-slate-700/80">
            <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center">
                <i class="fa-solid fa-ship text-brand-cyan mr-2.5 text-xl"></i>Rota<span class="text-brand-cyan">Porto</span>
            </h1>
            <p class="text-[10px] font-bold tracking-widest text-brand-cyan uppercase mt-0.5">PORT LOGISTICS HUB</p>
        </div>
        
        <nav class="flex-1 px-3 py-6 space-y-2">
            <!-- ÚNICA OPÇÃO RESTANTE CONFORME SOLICITADO -->
            <a href="#" class="nav-item flex items-center px-4 py-3.5 text-white rounded-xl transition-all bg-blue-600 shadow-lg shadow-blue-600/30 border-l-4 border-brand-cyan">
                <i class="fa-solid fa-magnifying-glass-location w-6 text-white"></i>
                <span class="font-semibold text-sm">Consulta de Frete</span>
            </a>
        </nav>
    </aside>

    <!-- Área Principal de Conteúdo -->
    <main class="flex-1 flex flex-col h-screen relative overflow-y-auto bg-slate-900">
        
        <!-- Header Superior Limpo -->
        <header class="h-20 bg-slate-900/90 backdrop-blur-md sticky top-0 z-10 px-8 flex items-center justify-between border-b border-slate-800">
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">Consulta de Frete</h2>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs bg-emerald-500/10 text-brand-emerald border border-emerald-500/30 px-3.5 py-1.5 rounded-full font-semibold flex items-center">
                    <span class="w-2 h-2 rounded-full bg-brand-emerald animate-pulse mr-2"></span> System Online
                </span>
            </div>
        </header>

        <div class="p-8 max-w-6xl mx-auto w-full">

            <!-- Banner Principal e Filtros -->
            <div class="bg-slate-800 border border-blue-500/30 rounded-2xl p-8 mb-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-slate-700/80 gap-4 relative z-10">
                    <div>
                        <h3 class="text-2xl font-extrabold text-white tracking-tight">Consulta Inteligente</h3>
                    </div>
                </div>

                <form class="grid grid-cols-1 md:grid-cols-3 gap-6 relative z-10" onsubmit="event.preventDefault(); filtrarTabela();">
                    
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Terminal / Porto</label>
                        <select id="select-porto" onchange="filtrarTabela()" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition">
                            <option value="">Todos os Terminais</option>
                            <option value="SUAPE" selected>SUAPE</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Destino</label>
                        <div class="relative">
                            <i class="fa-solid fa-location-dot absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                            <input type="text" id="input-destino" onkeyup="filtrarTabela()" placeholder="Digite o destino..." class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl pl-10 pr-4 py-3 outline-none focus:border-blue-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Tipo de Carga</label>
                        <select id="select-carga" onchange="filtrarTabela()" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition">
                            <option value="L">L</option>
                            <option value="LS">LS</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Tabela Estilo Excel (Exatamente como a planilha solicitada) -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl relative z-10">
                <div class="px-6 py-4 border-b border-slate-700 bg-slate-800/80 flex justify-between items-center">
                    <h4 class="font-bold text-white text-sm">Resultados Base de Dados Oficial</h4>
                    <span id="total-registros" class="text-xs text-brand-cyan font-bold">Calculando...</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-900/80 text-slate-300 border-b border-slate-700/80">
                                <th class="py-3 px-4 font-bold border-r border-slate-700">TERMINAL</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700">DESTINO</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right bg-blue-900/20" id="th-frete">FRETE L</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right bg-blue-900/20" id="th-pedagio">PEDÁGIO L</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-amber-300">GRIS</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-amber-300">ADVALOREM</th>
                                <th class="py-3 px-4 font-bold border-r border-slate-700 text-right text-brand-cyan">TOTAL S/ ICMS</th>
                                <th class="py-3 px-4 font-bold text-right text-brand-emerald bg-emerald-900/10">TOTAL C/ ICMS</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="text-slate-300 divide-y divide-slate-700/50">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Dados extraídos diretamente da aba "CC 789" da planilha "BUSCA FRETE OFICIAL 6.9 - INCLUSAO SUAPE_3.xlsx"
        // Mostrando uma amostra representativa (Para não pesar o HTML). Você pode adicionar todas.
        let baseFretes = [
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'ABREU E LIMA', freteL: 1526.23, freteLS: 1631.58, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'ALHANDRA', freteL: 2381.44, freteLS: 2576.85, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'AQUIRAZ', freteL: 10825.14, freteLS: 11889.33, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'ARACAJU', freteL: 6971.07, freteLS: 7644.71, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'ARAPIRACA', freteL: 4989.18, freteLS: 5456.31, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'ARCOVERDE', freteL: 4408.28, freteLS: 4745.77, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'BAYEUX', freteL: 2772.60, freteLS: 3008.77, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'BELO JARDIM', freteL: 3411.50, freteLS: 3714.24, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'BEZERROS', freteL: 2381.44, freteLS: 2576.85, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'BOA VISTA', freteL: 4154.71, freteLS: 4534.89, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'BOM CONSELHO', freteL: 5074.20, freteLS: 5551.41, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CABEDELO', freteL: 2977.16, freteLS: 3234.34, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CABO DE SANTO AGOSTINHO', freteL: 1045.24, freteLS: 1099.93, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CAMPINA GRANDE', freteL: 3672.76, freteLS: 4002.50, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CARUARU', freteL: 2795.34, freteLS: 3034.39, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'CAUCAIA', freteL: 11467.43, freteLS: 12602.83, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'EUSEBIO', freteL: 10763.53, freteLS: 11820.69, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'FORTALEZA', freteL: 11210.98, freteLS: 12318.57, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'GARANHUNS', freteL: 4403.73, freteLS: 4740.69, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'GOIANA', freteL: 2197.64, freteLS: 2372.48, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'IGARASSU', freteL: 1740.91, freteLS: 1869.60, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'JABOATAO DOS GUARARAPES', freteL: 1309.81, freteLS: 1391.80, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'JOAO PESSOA', freteL: 2795.34, freteLS: 3034.39, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'MACEIO', freteL: 4212.78, freteLS: 4599.27, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'MARACANAU', freteL: 11153.28, freteLS: 12254.42, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'MOSSORO', freteL: 9022.02, freteLS: 9886.99, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'NATAL', freteL: 5218.49, freteLS: 5711.45, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'PARNAMIRIM', freteL: 4899.40, freteLS: 5357.20, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'PAULISTA', freteL: 1610.15, freteLS: 1724.84, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'PETROLINA', freteL: 10471.18, freteLS: 11495.80, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'RECIFE', freteL: 1475.23, freteLS: 1575.29, pedagioL: 116.00, pedagioLS: 139.20 },
            { cliente: 'ALIANÇA', porto: 'SUAPE', destino: 'SANTA RITA', freteL: 2824.23, freteLS: 3066.36, pedagioL: 116.00, pedagioLS: 139.20 }
        ];

        // Formatador de Moeda BR
        const formatMoeda = (valor) => {
            if (valor === undefined || valor === null || isNaN(valor)) return "R$ 0,00";
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // Lógica de Renderização e Cálculos idêntico a Planilha Original
        function filtrarTabela() {
            const portoSel = document.getElementById('select-porto').value.toUpperCase();
            const destinoInput = document.getElementById('input-destino').value.toUpperCase().trim();
            const cargaSel = document.getElementById('select-carga').value; // 'L' ou 'LS'

            // Atualiza Cabecalho da tabela dinamicamente
            document.getElementById('th-frete').innerText = `FRETE ${cargaSel}`;
            document.getElementById('th-pedagio').innerText = `PEDÁGIO ${cargaSel}`;

            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';

            let contador = 0;

            baseFretes.forEach(f => {
                if ((portoSel === '' || f.porto === portoSel) && 
                    (destinoInput === '' || f.destino.includes(destinoInput))) {
                    
                    contador++;
                    
                    // Condicionais L e LS
                    const valorFrete = cargaSel === 'L' ? f.freteL : f.freteLS;
                    const valorPedagio = cargaSel === 'L' ? f.pedagioL : f.pedagioLS;
                    
                    // Simulação das Fórmulas da Planilha Original para preencher
                    // Substitua pelos valores/percentuais reais usados na sua planilha
                    const percGris = 0.003; // Exemplo 0.3%
                    const percAdvalorem = 0.002; // Exemplo 0.2%
                    
                    // Considerando um valor fixo de nota para o cálculo de GRIS/ADV, 
                    // Na planilha oficial, isso geralmente puxa do valor da NF. 
                    // Vamos usar um valor base de cálculo fictício de R$ 100.000 ou zerado se não informado
                    const baseCalculoNF = 100000; 
                    
                    const gris = baseCalculoNF * percGris;
                    const adv = baseCalculoNF * percAdvalorem;
                    
                    const totalSemIcms = valorFrete + valorPedagio + gris + adv;
                    const totalComIcms = totalSemIcms / 0.88; // Exemplo de ICMS 12% (1 - 0.12)

                    const bgRow = contador % 2 === 0 ? 'bg-slate-900/30' : 'bg-slate-800/20';

                    tbody.innerHTML += `
                        <tr class="${bgRow} hover:bg-blue-900/20 transition-colors">
                            <td class="py-3 px-4 font-semibold text-slate-100 border-r border-slate-700/50">${f.porto}</td>
                            <td class="py-3 px-4 font-bold text-white border-r border-slate-700/50">${f.destino}</td>
                            <td class="py-3 px-4 text-right font-medium text-slate-300 border-r border-slate-700/50">${formatMoeda(valorFrete)}</td>
                            <td class="py-3 px-4 text-right font-medium text-slate-300 border-r border-slate-700/50">${formatMoeda(valorPedagio)}</td>
                            <td class="py-3 px-4 text-right font-medium text-amber-200/80 border-r border-slate-700/50">${formatMoeda(gris)}</td>
                            <td class="py-3 px-4 text-right font-medium text-amber-200/80 border-r border-slate-700/50">${formatMoeda(adv)}</td>
                            <td class="py-3 px-4 text-right font-bold text-brand-cyan border-r border-slate-700/50">${formatMoeda(totalSemIcms)}</td>
                            <td class="py-3 px-4 text-right font-extrabold text-brand-emerald bg-emerald-900/5">${formatMoeda(totalComIcms)}</td>
                        </tr>
                    `;
                }
            });

            if (contador === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-500 font-semibold">Nenhuma rota encontrada para "${destinoInput}"</td></tr>`;
            }

            document.getElementById('total-registros').innerText = `${contador} rotas listadas`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            filtrarTabela();
        });
    </script>
</body>
</html>
